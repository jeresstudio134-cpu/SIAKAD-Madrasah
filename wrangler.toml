name = "siakad-madrasah"
main = "worker/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Serve Vite build static assets via Cloudflare Workers Assets
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"

# Environment variables & bindings (dapat dioverride via Cloudflare Dashboard / Secrets)
[vars]
NODE_ENV = "production"
